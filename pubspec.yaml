name: virusdownloader
description: "A modern cross-platform download manager."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.7.0

  # Storage & Paths
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # File Picker
  file_picker: ^8.1.4

  # Desktop Window
  window_manager: ^0.4.3

  # Package & version information
  package_info_plus: ^8.2.0

  # Utilities
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - extras/extension/
    - extras/extension/icons/
    - assets/bin/
