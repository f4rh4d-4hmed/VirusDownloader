<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VirusDownloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <img src="icons/icon32.png" alt="Logo" class="logo">
      <div>
        <h1 class="title">VirusDownloader</h1>
        <div class="status-indicator" id="statusIndicator">
          <span class="dot" id="statusDot"></span>
          <span class="status-text" id="statusText">Connecting...</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Refresh Media">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
      <button class="icon-btn" id="optionsBtn" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tabMediaBtn">
      <span>Detected Media</span>
      <span class="badge" id="mediaCountBadge">0</span>
    </button>
    <button class="tab-btn" id="tabManualBtn">
      <span>Manual URL</span>
    </button>
  </div>

  <!-- Main View 1: Media List -->
  <main class="content-view" id="mediaView">
    <div class="empty-state" id="emptyMediaState">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="#9ca3af">
        <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
      </svg>
      <p class="empty-title">No Media Streams Detected Yet</p>
      <p class="empty-desc">Play a video, audio, or reload the page to sniff high-quality media streams.</p>
    </div>
    <div class="media-list" id="mediaList"></div>
  </main>

  <!-- Main View 2: Manual Download with Headers -->
  <section class="content-view hidden" id="manualView">
    <form id="manualForm" class="manual-form">
      <div class="form-group">
        <label for="manualUrl">Download URL <span class="req">*</span></label>
        <input type="url" id="manualUrl" placeholder="https://example.com/stream.mp4" required>
      </div>
      <div class="form-group">
        <label for="manualFileName">File Name</label>
        <input type="text" id="manualFileName" placeholder="video.mp4">
      </div>
      <div class="form-group">
        <label for="manualReferer">Referer Header</label>
        <input type="text" id="manualReferer" placeholder="https://example.com/watch">
      </div>
      <div class="form-group">
        <label for="manualCustomHeaders">Custom Headers (JSON or Key: Value)</label>
        <textarea id="manualCustomHeaders" rows="3" placeholder='{"Cookie": "...", "User-Agent": "..."}'></textarea>
      </div>
      <button type="submit" class="btn-primary" id="manualSendBtn">
        <span>Send to VirusDownloader</span>
      </button>
    </form>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <label class="toggle-control" title="Intercept downloads initiated directly in browser">
      <input type="checkbox" id="interceptToggle">
      <span class="toggle-slider"></span>
      <span class="toggle-label">Intercept Browser Downloads</span>
    </label>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
